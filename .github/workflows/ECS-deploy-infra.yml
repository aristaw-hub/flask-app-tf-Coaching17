name: ECS Deploy Infrastructure

on:
  push:
    paths:
      - 'terraform/**'
    branches:
      - main
  workflow_dispatch:
    inputs:
  #    environment:
  #      description: 'Environment'
  #      required: true
  #      default: 'dev'
  #      type: choice
  #     options:
  #        - dev
  #        - staging
  #        - prod

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ./terraform
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Plan
        run: terraform plan -var="environment=${{ github.event.inputs.environment || 'dev' }}"
        continue-on-error: false
      
      - name: Terraform Apply
        run: terraform apply -auto-approve -var="environment=${{ github.event.inputs.environment || 'dev' }}"
      
      - name: Output Infrastructure Details
        run: |
          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV
          echo "ECS_CLUSTER=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_ENV
